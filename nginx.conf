# StreamTeX dual-mode Nginx configuration
# Serves both Streamlit (interactive) and static HTML exports.
#
# Routes:
#   /html/          -> static HTML export, English (always available)
#   /html/en/ /html/fr/ -> the export in that language (plan-i18n D3)
#   /html/<lang>/data/  -> exported assets (images, audio, video)
#   /               -> Streamlit app (with automatic fallback to /html/ on error)
#   /_stcore/health -> proxied to Streamlit (Coolify/Traefik health check)

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile   on;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    upstream streamlit {
        server 127.0.0.1:8501;
    }

    server {
        listen 80;
        server_name _;

        # --- Static HTML export ---

        # Exact matches: /html/ (English) and /html/<lang>/ redirect to the
        # exported file of that language (snippets written by the entrypoint).
        location = /html/ {
            include /app/static-html/.nginx-redirect.conf;
        }
        location = /html/en/ {
            include /app/static-html/.nginx-redirect-en.conf;
        }
        location = /html/fr/ {
            include /app/static-html/.nginx-redirect-fr.conf;
        }

        # Prefix match: serve exported files directly
        location /html/ {
            alias /app/static-html/;
            autoindex on;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Served-By "static";
        }

        # --- Medias servis par le conteneur lui-meme ---
        #
        # Le conteneur doit rester complet et autonome pendant la seance : aucun
        # appel au CDN une fois l'image construite. Les octets sont materialises
        # au build par _project/tools/sync_media.py sous <module>/static/media/,
        # et referencees par des URL /app/static/media/... — jamais inlinees en
        # base64, qui alourdirait chaque page de dizaines de megaoctets.
        #
        # Servi ICI, depuis le disque, et non proxifie vers Streamlit : le mode
        # static-only (Streamlit arrete) doit continuer d'afficher les images.
        # Le chemin depend du module : l'entrypoint regenere ce fragment.
        location /app/static/ {
            include /app/static-html/.nginx-media.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Served-By "media";
        }

        # --- Health check (Coolify/Traefik) ---
        # Try Streamlit first; if it's down, return 200 anyway
        # so the container stays alive in static-only mode.

        location = /_stcore/health {
            proxy_pass http://streamlit/_stcore/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            error_page 502 503 504 = @health_fallback;
        }

        location @health_fallback {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # --- Streamlit app (interactive, with WebSocket support) ---

        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;

            # If Streamlit is down or overloaded, redirect to static HTML
            error_page 502 503 504 = @fallback_static;
        }

        location @fallback_static {
            return 302 /html/;
        }
    }
}
