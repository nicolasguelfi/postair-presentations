# Hetzner/Coolify auto-deploy — triggered by every push to main.
#
# main IS production. Only the services whose files actually changed are
# redeployed:
#   - changes under modules/postair_<name>/**       → that service only
#   - changes in shared files (Dockerfile, pyproject.toml, uv.lock,
#     .stx-version, postair_pack/**, modules/shared-blocks/**, .github/**)
#                                                    → ALL services
#   - workflow_dispatch (manual run from the Actions tab) → ALL services
#
# Required secret: COOLIFY_API_TOKEN (Coolify → Security → API Tokens)

name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COOLIFY_URL: https://coolify.streamtex.org

jobs:
  deploy:
    name: Trigger Coolify deploys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for streamtex version on PyPI
        run: |
          REQUIRED=$(cat .stx-version | tr -d '[:space:]')
          echo "Required version from .stx-version: $REQUIRED"

          MAX_ATTEMPTS=12
          WAIT_SECONDS=30
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            PYPI=$(curl -s https://pypi.org/pypi/streamtex/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
            echo "Attempt $attempt/$MAX_ATTEMPTS — PyPI has: $PYPI"

            OK=$(python3 -c "
          r = tuple(int(x) for x in '$REQUIRED'.split('.'))
          p = tuple(int(x) for x in '$PYPI'.split('.'))
          print('yes' if p >= r else 'no')
          ")
            if [ "$OK" = "yes" ]; then
              echo "PyPI version $PYPI >= required $REQUIRED — proceeding"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Version too old (need >= $REQUIRED, PyPI has $PYPI). Retrying in ${WAIT_SECONDS}s..."
              sleep $WAIT_SECONDS
            fi
          done

          echo "::error::PyPI still has streamtex==$PYPI after $MAX_ATTEMPTS attempts (need >= $REQUIRED). Publish to PyPI first!"
          exit 1

      - name: Detect changed files and select services
        id: changed
        run: |
          # Service mapping: name → folder → Coolify UUID.
          # Adding a module = adding one line here (and creating the Coolify app).
          cat > /tmp/services.json << 'SERVICES'
          {
            "postair-opening": {"folder": "modules/postair_opening", "uuid": "f12d9utrj67uqwjqune5t4ip", "replicas": []},
            "postair-survey": {"folder": "modules/postair_survey", "uuid": "mcgto0uw68er5cmcy61z5853", "replicas": []},
            "postair-debates": {"folder": "modules/postair_debates", "uuid": "o655voa4o0r1gw9k1lhkujtg", "replicas": []},
            "postair-genai": {"folder": "modules/postair_genai", "uuid": "ki72ol1fqgno2g1rpi0t2m7o", "replicas": []},
            "postair-mistral": {"folder": "modules/postair_mistral", "uuid": "xkvxoqqby2vo2irwhgpcyt6q", "replicas": []},
            "postair-closing": {"folder": "modules/postair_closing", "uuid": "ni6y6q06e0xqbio0afyu62m3", "replicas": []},
            "postair-collection": {"folder": "modules/postair_collection", "uuid": "g5hnjmauge8443965yywvijs", "replicas": []},
            "postair-guidelines": {"folder": "modules/postair_guidelines", "uuid": "cx1yh8ef3kyg1uf50m1w0wmi", "replicas": []},
            "postair-handsup": {"folder": "modules/postair_handsup", "uuid": "kjl03arps9ma13llrbtx8403", "replicas": []},
            "postair-waves": {"folder": "modules/postair_waves", "uuid": "el8z66c5qww1780sjdi1emmv", "replicas": []}
          }
          SERVICES

          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual trigger — deploying ALL services"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push — deploying ALL services"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$changed_files"

          # Shared files → deploy all
          shared_patterns="^Dockerfile$|^entrypoint\.sh$|^nginx\.conf$|^\.stx-version$|^pyproject\.toml|^uv\.lock|^postair_pack/|^modules/shared-blocks/|^\.github/"
          if echo "$changed_files" | grep -qE "$shared_patterns"; then
            echo "Shared files changed — deploying ALL services"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Map changed paths to service UUIDs
          echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          uuids=$(python3 -c "
          import json
          services = json.load(open('/tmp/services.json'))
          changed = '''$changed_files'''.strip().split('\n')
          to_deploy = set()
          for f in changed:
              for name, info in services.items():
                  if f.startswith(info['folder'] + '/'):
                      to_deploy.add(info['uuid'])
                      for r in info.get('replicas', []):
                          to_deploy.add(r)
          print(' '.join(sorted(to_deploy)))
          ")
          echo "UUIDs to deploy: ${uuids:-none}"
          echo "uuids=$uuids" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify deploys
        if: steps.changed.outputs.deploy_all == 'true' || steps.changed.outputs.uuids != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN secret is not set"
            exit 1
          fi

          DEPLOY_ALL="${{ steps.changed.outputs.deploy_all }}"

          if [ "$DEPLOY_ALL" = "true" ]; then
            uuids=$(python3 -c "
          import json; services=json.load(open('/tmp/services.json'))
          all_uuids = []
          for s in services.values():
              all_uuids.append(s['uuid'])
              all_uuids.extend(s.get('replicas', []))
          print(' '.join(all_uuids))
          ")
          else
            uuids="${{ steps.changed.outputs.uuids }}"
          fi

          # SÉQUENTIEL PUR (NG 2026-08-21) : un service à la fois, on ATTEND
          # la fin de son build avant de déclencher le suivant. L'ancien lot
          # de 4 tuait les builds depuis la matrice complète des captures
          # (~600 Mo par image) : 3 builds parallèles = mort brutale (exit
          # 255, épuisement du serveur cax21) pendant le cache warmup, deux
          # déploiements de suite (20 et 21/08). Avec le cache de couches
          # Docker un build passe en 2-8 min — la fiabilité prime.
          deployed=0
          failed=0
          for uuid in $uuids; do
            echo "Deploying $uuid..."
            result=$(curl -s "$COOLIFY_URL/api/v1/deploy?uuid=$uuid" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Accept: application/json")
            dep=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin)['deployments'][0]['deployment_uuid'])" 2>/dev/null)

            if [ -z "$dep" ]; then
              echo "::error::Deploy failed for $uuid: $result"
              failed=$((failed + 1))
              continue
            fi

            echo "  -> queued ($dep), waiting for the build to finish..."
            status="in_progress"
            for i in $(seq 1 60); do   # 60 × 20 s = 20 min max par service
              sleep 20
              status=$(curl -s "$COOLIFY_URL/api/v1/deployments/$dep" \
                -H "Authorization: Bearer $COOLIFY_TOKEN" \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
              case "$status" in finished|failed|cancelled*) break;; esac
            done
            echo "  -> $status"

            if [ "$status" = "finished" ]; then
              deployed=$((deployed + 1))
            else
              echo "::error::Deployment $dep for $uuid ended as '$status'"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "Summary: $deployed deployed, $failed failed"
          [ "$failed" -eq 0 ] || exit 1

      - name: No deploy needed
        if: steps.changed.outputs.deploy_all != 'true' && steps.changed.outputs.uuids == ''
        run: echo "No services affected by this push — skipping deploy."
