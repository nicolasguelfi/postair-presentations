<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de `mistral_paths` : les deux chemins — le
       raccourci brillant qui finit contre un mur (l'examen), le chemin
       d'effort qui monte au sommet. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#BFE3EC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- le sol de papier -->
  <path d="M0 780 q400 -40 800 0 q400 40 800 0 l0 120 l-1600 0 z" fill="#DFF3F0" filter="url(#ds)"/>
  <!-- la silhouette au départ, de dos, devant le choix -->
  <g fill="#1A1A2E" filter="url(#ds)">
    <circle cx="240" cy="600" r="46"/>
    <path d="M194 640 q46 -30 92 0 l12 160 h-116 z"/>
  </g>
  <!-- chemin 1 : le raccourci brillant, plat, vers le mur -->
  <path d="M340 760 q300 -30 620 -10" stroke="#FFD34D" stroke-width="26"
        fill="none" stroke-linecap="round" filter="url(#ds)"/>
  <g filter="url(#ds)">
    <rect x="1000" y="560" width="60" height="220" rx="10" fill="#E07A6E"/>
    <rect x="1000" y="560" width="60" height="44" rx="10" fill="#C05A50"/>
  </g>
  <!-- chemin 2 : les marches d'effort, vers le sommet -->
  <g filter="url(#ds)">
    <rect x="420" y="640" width="150" height="30" rx="8" fill="#2EC4B6"/>
    <rect x="560" y="560" width="150" height="30" rx="8" fill="#2EC4B6"/>
    <rect x="700" y="480" width="150" height="30" rx="8" fill="#2EC4B6"/>
    <rect x="840" y="400" width="150" height="30" rx="8" fill="#2EC4B6"/>
    <rect x="980" y="320" width="150" height="30" rx="8" fill="#2EC4B6"/>
  </g>
  <!-- le sommet : un fanion de papier et le soleil ambre -->
  <g filter="url(#ds)">
    <path d="M1180 120 l360 160 q40 20 0 40 l-360 160 z" fill="#B79CED" opacity="0.5"/>
    <line x1="1160" y1="300" x2="1160" y2="120" stroke="#1A1A2E" stroke-width="14" stroke-linecap="round"/>
    <path d="M1160 120 l110 34 l-110 34 z" fill="#FF6F61"/>
  </g>
  <g filter="url(#ds)">
    <circle cx="1420" cy="150" r="80" fill="#F39C12"/>
    <circle cx="1420" cy="150" r="52" fill="#FFD34D"/>
  </g>
</svg>
