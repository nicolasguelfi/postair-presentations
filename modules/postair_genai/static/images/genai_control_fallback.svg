<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de `genai_control` : quelques grandes mains de
       carton tiennent les orbes ambre, la foule de silhouettes regarde d'en bas. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#BFE3EC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- trois grandes mains de papier montées sur bras, chacune son orbe -->
  <g filter="url(#ds)">
    <polygon points="360,900 430,900 452,470 338,470" fill="#B79CED"/>
    <path d="M310 470 h180 l-16 -76 q-74 -34 -148 0 z" fill="#B79CED"/>
    <circle cx="400" cy="330" r="72" fill="#F39C12"/>
    <circle cx="380" cy="310" r="20" fill="#FFD34D"/>
  </g>
  <g filter="url(#ds)">
    <polygon points="760,900 830,900 850,380 740,380" fill="#FF6F61"/>
    <path d="M712 380 h184 l-16 -78 q-76 -36 -152 0 z" fill="#FF6F61"/>
    <circle cx="802" cy="236" r="82" fill="#F39C12"/>
    <circle cx="780" cy="212" r="22" fill="#FFD34D"/>
  </g>
  <g filter="url(#ds)">
    <polygon points="1160,900 1230,900 1250,470 1140,470" fill="#2EC4B6"/>
    <path d="M1112 470 h182 l-16 -76 q-75 -34 -150 0 z" fill="#2EC4B6"/>
    <circle cx="1200" cy="330" r="72" fill="#F39C12"/>
    <circle cx="1178" cy="308" r="20" fill="#FFD34D"/>
  </g>
  <!-- la foule, petite, en bas -->
  <path d="M0 780 L200 764 L440 786 L700 766 L960 788 L1220 768 L1600 786 L1600 900 L0 900 Z"
        fill="#7FB069" filter="url(#ds)"/>
  <g fill="#1A1A2E" filter="url(#ds)">
    <g transform="translate(190,812)"><circle r="16"/><path d="M-16 13 q16 -11 32 0 l4 60 h-40 z"/></g>
    <g transform="translate(300,824)"><circle r="14"/><path d="M-14 11 q14 -10 28 0 l3 52 h-34 z"/></g>
    <g transform="translate(590,818)"><circle r="15"/><path d="M-15 12 q15 -10 30 0 l3 56 h-36 z"/></g>
    <g transform="translate(980,822)"><circle r="14"/><path d="M-14 11 q14 -10 28 0 l3 52 h-34 z"/></g>
    <g transform="translate(1390,816)"><circle r="16"/><path d="M-16 13 q16 -11 32 0 l4 58 h-40 z"/></g>
  </g>
</svg>
