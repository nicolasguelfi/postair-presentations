<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de `genai_horizon` : la silhouette marche vers le
       grand soleil ambre, collines de papier, longues ombres douces. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#FFD9A0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- le grand soleil de papier, bas sur l'horizon -->
  <g filter="url(#ds)">
    <circle cx="1080" cy="520" r="220" fill="#F5A623"/>
    <circle cx="1080" cy="512" r="170" fill="#F39C12"/>
    <circle cx="1036" cy="468" r="42" fill="#FFD34D"/>
  </g>
  <!-- rayons de papier -->
  <g fill="#FFD34D" filter="url(#ds)">
    <polygon points="1080,240 1110,300 1050,300"/>
    <polygon points="1330,330 1268,368 1296,404"/>
    <polygon points="830,330 892,368 864,404"/>
  </g>
  <!-- collines de papier, bords découpés -->
  <path d="M0 620 L200 596 L420 628 L680 598 L940 632 L1220 600 L1450 630 L1600 610 L1600 900 L0 900 Z"
        fill="#7FB069" filter="url(#ds)"/>
  <path d="M0 720 L240 700 L520 732 L820 702 L1120 736 L1400 706 L1600 726 L1600 900 L0 900 Z"
        fill="#2EC4B6" filter="url(#ds)"/>
  <path d="M0 810 L280 792 L600 816 L940 794 L1260 818 L1600 798 L1600 900 L0 900 Z"
        fill="#B79CED" filter="url(#ds)"/>
  <!-- la silhouette en marche, de dos, et sa longue ombre -->
  <ellipse cx="470" cy="770" rx="150" ry="20" fill="#7a6a4f" opacity="0.3"/>
  <g fill="#1A1A2E" filter="url(#ds)">
    <circle cx="520" cy="520" r="46"/>
    <path d="M474 558 q46 -28 92 0 l10 130 q-56 18 -112 0 z"/>
    <path d="M496 688 l-14 96 h30 l12 -80" />
    <path d="M544 688 l22 92 h30 l-24 -96" />
  </g>
  <!-- les trois compagnons-mascottes, petits, qui marchent avec elle -->
  <g fill="#1A1A2E" filter="url(#ds)">
    <g transform="translate(660,660)"><circle r="24"/><path d="M-24 20 q24 -16 48 0 l5 70 h-58 z"/></g>
    <g transform="translate(742,676)"><circle r="19"/><path d="M-19 15 q19 -13 38 0 l4 58 h-46 z"/></g>
    <g transform="translate(816,688)"><circle r="16"/><path d="M-16 13 q16 -11 32 0 l3 48 h-38 z"/></g>
  </g>
</svg>
