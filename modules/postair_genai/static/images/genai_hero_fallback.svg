<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de l'image héro `genai_hero` (ligne s4 2026-07-29) :
       cartons vifs, bords irréguliers, ombres portées, ciel lumineux,
       soleil-orbe ambre = l'IA, silhouettes de dos. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#BFE3EC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- rayons de papier du soleil -->
  <g fill="#FFD34D" filter="url(#ds)">
    <polygon points="800,110 830,215 770,213"/>
    <polygon points="1035,190 962,268 995,300"/>
    <polygon points="565,190 638,268 605,300"/>
    <polygon points="1090,420 985,428 990,468"/>
    <polygon points="510,420 615,428 610,468"/>
  </g>
  <!-- le soleil-orbe ambre, deux couches de papier -->
  <circle cx="800" cy="400" r="168" fill="#F5A623" filter="url(#ds)"/>
  <circle cx="800" cy="392" r="128" fill="#F39C12"/>
  <circle cx="768" cy="360" r="34" fill="#FFD34D" opacity="0.85"/>
  <!-- petites étoiles-constellation en papier, reliées par des fils -->
  <g stroke="#B79CED" stroke-width="4" stroke-opacity="0.7">
    <line x1="380" y1="220" x2="565" y2="300"/><line x1="1220" y1="210" x2="1035" y2="300"/>
    <line x1="300" y1="470" x2="510" y2="450"/><line x1="1300" y1="470" x2="1090" y2="450"/>
  </g>
  <g filter="url(#ds)">
    <polygon points="380,220 402,242 380,264 358,242" fill="#2EC4B6"/>
    <polygon points="1220,210 1244,234 1220,258 1196,234" fill="#FF6F61"/>
    <polygon points="300,470 322,492 300,514 278,492" fill="#B79CED"/>
    <polygon points="1300,470 1324,494 1300,518 1276,494" fill="#7FB069"/>
  </g>
  <!-- collines de papier superposées, bords découpés -->
  <path d="M0 640 L120 618 L260 648 L430 612 L610 650 L790 620 L980 652 L1180 616 L1380 648 L1600 624 L1600 900 L0 900 Z"
        fill="#7FB069" filter="url(#ds)"/>
  <path d="M0 720 L180 700 L360 730 L560 702 L780 734 L1000 704 L1240 736 L1440 708 L1600 730 L1600 900 L0 900 Z"
        fill="#2EC4B6" filter="url(#ds)"/>
  <path d="M0 800 L220 784 L460 808 L720 786 L980 810 L1240 788 L1600 806 L1600 900 L0 900 Z"
        fill="#FF6F61" filter="url(#ds)"/>
  <!-- la petite foule, silhouettes de papier vues de dos -->
  <g fill="#1A1A2E" filter="url(#ds)">
    <g transform="translate(600,690)"><circle cx="0" cy="0" r="26"/><path d="M-26 22 q26 -18 52 0 l6 96 h-64 z"/></g>
    <g transform="translate(724,712)"><circle cx="0" cy="0" r="22"/><path d="M-22 18 q22 -15 44 0 l5 80 h-54 z"/></g>
    <g transform="translate(884,706)"><circle cx="0" cy="0" r="24"/><path d="M-24 20 q24 -16 48 0 l5 88 h-58 z"/></g>
    <g transform="translate(1010,692)"><circle cx="0" cy="0" r="20"/><path d="M-20 16 q20 -14 40 0 l4 74 h-48 z"/></g>
  </g>
</svg>
