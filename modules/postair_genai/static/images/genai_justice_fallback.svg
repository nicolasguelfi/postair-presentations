<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de `genai_justice` : la balance à l'équilibre —
       la pile de dossiers d'un côté, l'orbe ambre de l'autre, le palais de
       justice de carton derrière. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#BFE3EC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD34D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD34D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- palais de justice de carton, en fond -->
  <g filter="url(#ds)" opacity="0.95">
    <rect x="480" y="330" width="640" height="330" fill="#FFF1DC"/>
    <polygon points="440,330 1160,330 800,190" fill="#FF6F61"/>
    <rect x="530" y="380" width="60" height="280" rx="8" fill="#B79CED"/>
    <rect x="650" y="380" width="60" height="280" rx="8" fill="#B79CED"/>
    <rect x="890" y="380" width="60" height="280" rx="8" fill="#B79CED"/>
    <rect x="1010" y="380" width="60" height="280" rx="8" fill="#B79CED"/>
  </g>
  <path d="M0 760 Q 400 690 800 750 T 1600 730 V900 H0 Z" fill="#2EC4B6" filter="url(#ds)"/>
  <path d="M0 840 Q 500 780 1000 830 T 1600 820 V900 H0 Z" fill="#7FB069" filter="url(#ds)"/>
  <!-- la balance, à l'équilibre -->
  <g filter="url(#ds)">
    <rect x="770" y="300" width="60" height="420" rx="16" fill="#FFD34D"/>
    <polygon points="700,730 900,730 860,680 740,680" fill="#FFD34D"/>
    <rect x="440" y="288" width="720" height="34" rx="17" fill="#FFD34D"/>
    <!-- plateau gauche : la pile de dossiers -->
    <path d="M470 322 v70" stroke="#8a6f4d" stroke-width="10"/>
    <path d="M370 392 h200 l-18 56 q -82 30 -164 0 z" fill="#FF6F61"/>
    <g>
      <rect x="392" y="352" width="156" height="26" rx="6" fill="#2EC4B6"/>
      <rect x="384" y="322" width="172" height="26" rx="6" fill="#B79CED"/>
      <rect x="396" y="292" width="148" height="26" rx="6" fill="#FF6F61"/>
      <rect x="388" y="262" width="164" height="26" rx="6" fill="#FFF7E8"/>
    </g>
    <!-- plateau droit : l'orbe -->
    <path d="M1130 322 v70" stroke="#8a6f4d" stroke-width="10"/>
    <path d="M1030 392 h200 l-18 56 q -82 30 -164 0 z" fill="#2EC4B6"/>
  </g>
  <circle cx="1130" cy="320" r="170" fill="url(#glow)"/>
  <g filter="url(#ds)">
    <circle cx="1130" cy="320" r="82" fill="#F39C12"/>
    <circle cx="1106" cy="296" r="24" fill="#FFD34D"/>
  </g>
  <g fill="#FFFFFF" filter="url(#ds)" opacity="0.9">
    <ellipse cx="220" cy="130" rx="100" ry="36"/>
    <ellipse cx="1420" cy="100" rx="90" ry="32"/>
  </g>
</svg>
