<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de `genai_diagnosis` : le médecin de dos, l'orbe
       ambre qui éclaire la grande radiographie de papier entre eux. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#BFE3EC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD34D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD34D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- collines de carton -->
  <path d="M0 780 Q 400 690 800 760 T 1600 740 V900 H0 Z" fill="#7FB069" filter="url(#ds)"/>
  <path d="M0 840 Q 500 780 1000 830 T 1600 820 V900 H0 Z" fill="#2EC4B6" filter="url(#ds)"/>
  <!-- la grande radiographie de papier, au centre -->
  <g filter="url(#ds)">
    <rect x="560" y="200" width="480" height="420" rx="18" fill="#B79CED"/>
    <rect x="590" y="230" width="420" height="360" rx="12" fill="#FFF7E8"/>
    <!-- cage thoracique découpée : corail et turquoise -->
    <rect x="770" y="260" width="40" height="300" rx="20" fill="#2EC4B6"/>
    <g fill="none" stroke="#FF6F61" stroke-width="26" stroke-linecap="round">
      <path d="M780 300 q -110 24 -140 74"/>
      <path d="M780 370 q -120 24 -150 74"/>
      <path d="M780 440 q -110 24 -140 74"/>
      <path d="M800 300 q 110 24 140 74"/>
      <path d="M800 370 q 120 24 150 74"/>
      <path d="M800 440 q 110 24 140 74"/>
    </g>
  </g>
  <!-- le médecin, silhouette de dos, stéthoscope de papier -->
  <g filter="url(#ds)">
    <circle cx="330" cy="420" r="62" fill="#1A1A2E"/>
    <path d="M330 470 q -110 0 -122 210 h244 q -12 -210 -122 -210 z" fill="#1A1A2E"/>
    <path d="M258 690 h144 v90 h-144 z" fill="#1A1A2E"/>
    <path d="M300 520 q 30 60 60 0" fill="none" stroke="#FFD34D" stroke-width="14" stroke-linecap="round"/>
    <circle cx="360" cy="540" r="16" fill="#FFD34D"/>
  </g>
  <!-- l'orbe ambre, qui éclaire la radio -->
  <circle cx="1270" cy="330" r="240" fill="url(#glow)"/>
  <g filter="url(#ds)">
    <circle cx="1270" cy="330" r="120" fill="#F39C12"/>
    <circle cx="1236" cy="296" r="34" fill="#FFD34D"/>
  </g>
  <!-- rayons de lumière découpés vers la radio -->
  <g fill="#FFD34D" opacity="0.75">
    <polygon points="1150,320 1060,290 1064,306"/>
    <polygon points="1146,360 1052,376 1058,390"/>
    <polygon points="1160,394 1080,440 1090,452"/>
  </g>
  <!-- petits nuages de papier -->
  <g fill="#FFFFFF" filter="url(#ds)" opacity="0.9">
    <ellipse cx="220" cy="140" rx="90" ry="34"/>
    <ellipse cx="1420" cy="110" rx="110" ry="38"/>
  </g>
</svg>
