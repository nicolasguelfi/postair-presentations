<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de `genai_practices` : l'étudiant augmenté en
       chemin — silhouette de dos, orbe IA ambre (#F39C12, le jeton maison),
       jalons des bonnes pratiques. Palette ALIGNÉE sur la famille des replis
       (retouche NG 2026-09-02 : la v1 dérivait — violet dominant, ambre hors
       jeton, bleus étrangers) : jaune FFD34D, corail FF6F61, vert feuille
       7FB069, teal 2EC4B6, ambre F39C12, lilas B79CED en accent. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#BFE3EC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- l'orbe IA, soleil ambre de la maison, haut de chemin -->
  <circle cx="1290" cy="210" r="115" fill="#F39C12" filter="url(#ds)"/>
  <circle cx="1290" cy="210" r="160" fill="#F39C12" opacity="0.25"/>
  <!-- le sentier de papier crème, en lacets vers l'orbe -->
  <path d="M120 860 q360 -60 560 -140 q260 -100 420 -200 q140 -88 250 -170
           l30 34 q-110 78 -250 168 q-150 104 -410 204 q-210 82 -570 136 z"
        fill="#FFF8EA" filter="url(#ds)"/>
  <!-- collines de papier vert feuille -->
  <path d="M0 760 q220 -120 460 -40 q-200 90 -460 120 z" fill="#7FB069" filter="url(#ds)"/>
  <path d="M1180 700 q200 -110 420 -60 l0 160 q-260 -20 -420 -100 z" fill="#7FB069" filter="url(#ds)"/>
  <!-- les jalons du bord de chemin : liste jaune, boussole teal, bouclier corail -->
  <g filter="url(#ds)">
    <rect x="300" y="560" width="126" height="166" rx="14" fill="#FFD34D"/>
    <line x1="326" y1="606" x2="400" y2="606" stroke="#FF6F61" stroke-width="12"/>
    <line x1="326" y1="650" x2="400" y2="650" stroke="#FF6F61" stroke-width="12"/>
    <line x1="326" y1="694" x2="374" y2="694" stroke="#FF6F61" stroke-width="12"/>
  </g>
  <g filter="url(#ds)">
    <circle cx="770" cy="470" r="72" fill="#2EC4B6"/>
    <polygon points="770,416 793,470 770,524 747,470" fill="#FFF8EA"/>
  </g>
  <g filter="url(#ds)">
    <path d="M1090 310 q54 22 108 0 l0 86 q0 64 -54 94 q-54 -30 -54 -94 z" fill="#FF6F61"/>
    <path d="M1114 376 l22 24 l38 -50" stroke="#FFF8EA" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>
  <!-- la silhouette de l'étudiant, de dos, sac lilas en accent -->
  <g filter="url(#ds)">
    <circle cx="560" cy="592" r="46" fill="#2E4057"/>
    <path d="M520 636 q40 -22 80 0 l16 150 q-56 22 -112 0 z" fill="#2E4057"/>
    <rect x="596" y="664" width="46" height="74" rx="20" fill="#B79CED"/>
    <path d="M540 782 l-24 76 l30 0 l22 -62 z" fill="#2E4057"/>
    <path d="M596 782 l20 76 l30 0 l-16 -80 z" fill="#2E4057"/>
  </g>
  <!-- le fil de lumière ambre, de l'orbe vers l'épaule -->
  <path d="M1200 280 q-320 120 -600 300" stroke="#F39C12" stroke-width="8"
        fill="none" opacity="0.55" stroke-linecap="round"/>
</svg>
