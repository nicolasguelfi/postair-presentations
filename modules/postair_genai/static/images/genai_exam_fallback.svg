<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de `genai_exam` : l'examen reste humain — la
       silhouette écrit à son pupitre, l'orbe ambre attend DERRIÈRE la porte. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#BFE3EC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- la salle : un mur de papier, une horloge -->
  <rect x="0" y="120" width="1080" height="640" fill="#FFF8EA" filter="url(#ds)"/>
  <circle cx="540" cy="230" r="54" fill="#B79CED" filter="url(#ds)"/>
  <circle cx="540" cy="230" r="40" fill="#FFF8EA"/>
  <line x1="540" y1="230" x2="540" y2="204" stroke="#1A1A2E" stroke-width="6" stroke-linecap="round"/>
  <line x1="540" y1="230" x2="560" y2="242" stroke="#1A1A2E" stroke-width="6" stroke-linecap="round"/>
  <!-- le pupitre et la silhouette qui écrit, de dos -->
  <g filter="url(#ds)">
    <rect x="380" y="520" width="340" height="26" rx="13" fill="#FFD34D"/>
    <rect x="404" y="546" width="30" height="160" fill="#FFD34D"/>
    <rect x="666" y="546" width="30" height="160" fill="#FFD34D"/>
    <path d="M470 508 l160 0 -8 -22 -144 0 z" fill="#FFF8EA"/>
  </g>
  <g fill="#1A1A2E" filter="url(#ds)">
    <circle cx="550" cy="380" r="44"/>
    <path d="M506 416 q44 -30 88 0 l12 108 h-112 z"/>
    <path d="M594 452 q52 18 64 62" stroke="#1A1A2E" stroke-width="26" fill="none" stroke-linecap="round"/>
  </g>
  <!-- la porte fermée, et l'orbe qui attend dehors -->
  <rect x="1150" y="300" width="230" height="460" rx="16" fill="#2EC4B6" filter="url(#ds)"/>
  <circle cx="1340" cy="540" r="14" fill="#FFF8EA"/>
  <circle cx="1470" cy="640" r="80" fill="#F39C12" filter="url(#ds)"/>
  <circle cx="1448" cy="616" r="20" fill="#FFD34D"/>
  <!-- sol de papier -->
  <path d="M0 760 L240 744 L520 766 L820 746 L1140 768 L1420 748 L1600 762 L1600 900 L0 900 Z"
        fill="#7FB069" filter="url(#ds)"/>
</svg>
