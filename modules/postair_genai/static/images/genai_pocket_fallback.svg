<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Repli PAPIER DÉCOUPÉ de `genai_pocket` : smartphone de carton, écran-orbe
       ambre, cinq satellites de papier vif sur leurs anneaux d'orbite. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a6a4f" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/><stop offset="1" stop-color="#BFE3EC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- anneaux d'orbite en papier lilas -->
  <g fill="none" stroke="#B79CED" stroke-width="8" stroke-dasharray="34 22" stroke-linecap="round" opacity="0.8">
    <ellipse cx="800" cy="450" rx="330" ry="290"/>
    <ellipse cx="800" cy="450" rx="470" ry="392" opacity="0.5"/>
  </g>
  <!-- le téléphone : deux couches de carton -->
  <rect x="676" y="240" width="248" height="428" rx="36" fill="#FF6F61" filter="url(#ds)"/>
  <rect x="696" y="262" width="208" height="384" rx="26" fill="#FFF8EA"/>
  <circle cx="800" cy="612" r="17" fill="#FF6F61"/>
  <!-- l'écran-orbe ambre -->
  <circle cx="800" cy="420" r="86" fill="#F39C12" filter="url(#ds)"/>
  <circle cx="776" cy="396" r="24" fill="#FFD34D" opacity="0.9"/>
  <!-- cinq satellites de papier, un par IA du quotidien -->
  <g filter="url(#ds)">
    <g transform="translate(800,140) rotate(-6)"><rect x="-58" y="-46" width="116" height="92" rx="18" fill="#FFD34D"/><text x="0" y="14" font-family="sans-serif" font-size="46" text-anchor="middle">⌨️</text></g>
    <g transform="translate(1122,300) rotate(7)"><rect x="-58" y="-46" width="116" height="92" rx="18" fill="#2EC4B6"/><text x="0" y="14" font-family="sans-serif" font-size="46" text-anchor="middle">📷</text></g>
    <g transform="translate(1064,682) rotate(-5)"><rect x="-58" y="-46" width="116" height="92" rx="18" fill="#B79CED"/><text x="0" y="14" font-family="sans-serif" font-size="46" text-anchor="middle">🎬</text></g>
    <g transform="translate(536,682) rotate(6)"><rect x="-58" y="-46" width="116" height="92" rx="18" fill="#7FB069"/><text x="0" y="14" font-family="sans-serif" font-size="46" text-anchor="middle">🌍</text></g>
    <g transform="translate(478,300) rotate(-8)"><rect x="-58" y="-46" width="116" height="92" rx="18" fill="#FF6F61"/><text x="0" y="14" font-family="sans-serif" font-size="46" text-anchor="middle">💬</text></g>
  </g>
  <!-- sol de papier -->
  <path d="M0 820 L260 800 L560 826 L900 802 L1240 828 L1600 806 L1600 900 L0 900 Z"
        fill="#2EC4B6" filter="url(#ds)"/>
</svg>
