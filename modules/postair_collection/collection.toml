# AI Day — le livre des modules (modèle : stx_manuals_collection de streamtex-docs).
#
# Ajouter un module = ajouter une section [projects.xxx] ici (rien d'autre à
# coder : bck_home lit ce fichier). Les textes (title, description,
# button_label) sont des FEUILLES bilingues { en = …, fr = … } (règle R-i18n,
# 2026-08-28) — une chaîne nue vaut anglais seul. L'URL locale est le défaut ; en déploiement
# Coolify, la variable d'environnement STX_URL_XXX (clé en MAJUSCULES, tirets
# devenus soulignés) la surcharge. L'ordre est celui de l'agenda officiel du
# jour (postair_event.AGENDA) — pas un choix éditorial de ce fichier.
#
# Ce toml est AUSSI la source de la chaîne de fin de deck (postair_chain,
# NG 2026-08-19) : le bouton « module suivant » et le hub ne peuvent pas
# diverger. Le lien « static HTML version » se DÉRIVE par convention :
# <project_url>/html/<lang>/ (le nginx de chaque conteneur sert UN export
# par langue là, redirigé vers /html/<lang>/postair_<key>/postair_<key>.html
# — plan-i18n D3, 2026-08-28). Surcharges :
# export_url (clé optionnelle par projet) puis STX_EXPORT_URL_<KEY> (env,
# ex. un export local servi). En local,
# run-postair.py pose STX_URL_<KEY>=http://localhost:<port> sur chaque
# instance : une instance locale chaîne en local, sans geste ni réglage.
#
# postair_mistral ajouté le 2026-09-02 (première version du module — le
# service Coolify et sa variable STX_URL_MISTRAL restent à créer au
# déploiement ; l'URL ci-dessous suit la convention des autres modules).

