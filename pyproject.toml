[project]
name = "postair-presentations"
version = "0.1.0"
description = "AI Day — POSTAIR StreamTeX presentations (University of Luxembourg, Welcome Week 2026)"
requires-python = ">=3.11"
dependencies = [
    "streamtex[ai,cli]>=0.7.26,<0.8",
    "postair-pack",
    "segno>=1.6.6",
]

# Outillage du POSTE, jamais de l'image (NG 2026-08-24) : le Dockerfile fait
# `uv sync --no-dev`, ces paquets n'entrent donc pas en production.
#
# playwright sert l'export PDF du panneau « Download as… » : streamtex ne
# propose le format que si le paquet ET son Chromium sont présents
# (`_is_pdf_available`). Décision NG : le PDF est une fonction de l'ORATEUR,
# en local — les decks en ligne offrent déjà l'export HTML sous `/html/`, et
# embarquer Chromium coûterait ~400 Mo par image. Le navigateur ne s'installe
# jamais par pip : `uv run playwright install chromium` (voir MACHINE.md).
[dependency-groups]
dev = [
    "playwright>=1.47",
]

[tool.uv.sources]
postair-pack = { path = "postair_pack", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F403", "F405", "E701", "E741"]

[tool.ruff.lint.per-file-ignores]
# book.py: `import setup` MUST run first (sys.path for shared-blocks) — no isort.
"modules/*/book.py" = ["I001", "E402"]
