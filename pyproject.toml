[project]
name = "postair-presentations"
version = "0.1.0"
description = "AI Day — POSTAIR StreamTeX presentations (University of Luxembourg, Welcome Week 2026)"
requires-python = ">=3.11"
dependencies = [
    "streamtex[ai,cli]>=0.7.25,<0.8",
    "postair-pack",
    "segno>=1.6.6",
    # Export PDF depuis le panneau « Download as… » : streamtex n'offre le
    # format que si playwright ET son Chromium sont présents
    # (`_is_pdf_available`). Le navigateur, lui, ne s'installe pas par pip :
    # `uv run playwright install chromium` sur chaque poste, et une couche
    # dédiée dans le Dockerfile pour le conteneur.
    "playwright>=1.47",
]

[tool.uv.sources]
postair-pack = { path = "postair_pack", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F403", "F405", "E701", "E741"]

[tool.ruff.lint.per-file-ignores]
# book.py: `import setup` MUST run first (sys.path for shared-blocks) — no isort.
"modules/*/book.py" = ["I001", "E402"]
